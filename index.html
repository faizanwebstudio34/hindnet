<!doctype html><html lang="hi" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hindnet | Premium Laptops, Accessories & Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1018;--card:#141a26;--ink:#eef1f8;--mut:#8f98ad;--ac:#5b6bff;--ln:#ffffff17;--r:18px}
[data-theme=light]{--bg:#eef0f6;--card:#fff;--ink:#0d1020;--mut:#5d647a;--ac:#3b49e0;--ln:#0d102018}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 "Instrument Sans",sans-serif;transition:background .4s,color .4s}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.03em;line-height:1.05}
body.noanim *{animation:none!important;transition:none!important}
nav{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 4vw;background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:24px;color:var(--ink);text-decoration:none}
.links{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.links a,.ib{padding:8px 14px;border-radius:99px;color:var(--mut);text-decoration:none;font-size:14px;white-space:nowrap;transition:.25s;cursor:pointer;border:0;background:none;font-family:inherit}
.links a:hover,.links a.on,.ib:hover{color:var(--ink);background:var(--ln)}
main{padding:96px 4vw 60px;max-width:1280px;margin:auto;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;min-height:82vh;position:relative}
.hero:before{content:"";position:absolute;right:-10%;top:10%;width:55%;aspect-ratio:1;background:radial-gradient(var(--ac),transparent 65%);opacity:.28;filter:blur(40px);z-index:-1;animation:pu 6s ease-in-out infinite alternate}
@keyframes pu{to{opacity:.12;transform:scale(1.15)}}
.hero h1{font-size:clamp(40px,6.4vw,88px);font-weight:800}
.lead{color:var(--mut);max-width:48ch;margin:22px 0 30px;font-size:18px}
.btn{display:inline-block;padding:13px 26px;border-radius:99px;font:600 15px "Instrument Sans";text-decoration:none;border:1px solid var(--ln);color:var(--ink);cursor:pointer;background:none;transition:.25s}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.sm{padding:8px 16px;font-size:13px}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px color-mix(in srgb,var(--ac) 35%,transparent)}
.lap{perspective:1100px;animation:fy 6s ease-in-out 1.8s infinite}@keyframes fy{50%{transform:translateY(-16px)}}
.scr{aspect-ratio:16/10;border-radius:16px 16px 0 0;border:9px solid #1c2233;background:#0a0e18;padding:6% 8%;transform-origin:50% 100%;animation:open 1.6s .2s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 0 80px color-mix(in srgb,var(--ac) 45%,transparent)}
@keyframes open{from{transform:rotateX(-90deg);opacity:.2}}
.scr s{display:block;height:10px;margin-bottom:14px;border-radius:5px;background:var(--ac);animation:bar 3s ease-in-out infinite alternate}
.scr s:nth-child(2){background:#ffffff30;animation-delay:.5s}.scr s:nth-child(3){animation-delay:1s;background:#ffffff18}.scr s:nth-child(4){animation-delay:1.5s}
@keyframes bar{from{width:15%}to{width:90%}}
.bs{height:14px;background:linear-gradient(#cfd4e0,#7d8498);border-radius:0 0 22px 22px;margin:0 -5%}
.mq{overflow:hidden;white-space:nowrap;border-block:1px solid var(--ln);padding:20px 0;margin:30px 0 60px}
.mq span{display:inline-block;animation:mq 30s linear infinite;font:800 34px "Bricolage Grotesque";color:var(--mut)}.mq i{font-style:normal;margin:0 36px}
@keyframes mq{to{transform:translateX(-50%)}}
.stats{display:flex;gap:50px;flex-wrap:wrap;margin-bottom:70px}.stats b{font:800 52px "Bricolage Grotesque"}.stats p{color:var(--mut)}
h2{font-size:clamp(28px,4vw,46px);margin:50px 0 24px}.ph{font-size:clamp(40px,6vw,72px);font-weight:800}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;transition:transform .2s ease-out,border-color .3s,box-shadow .4s}
.card:hover{border-color:var(--ac);box-shadow:0 24px 60px #0005}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--ln)}
.b{padding:18px}.b small{color:var(--ac);font-weight:600}.m{color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.row b{font:800 22px "Bricolage Grotesque"}
.rv{opacity:0}.rv.in{opacity:1;animation:in .7s}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;margin:6px 0}
.sr{max-width:420px;margin-bottom:26px}input:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pn{max-width:480px;margin:26px auto;padding:30px;background:var(--card);border:1px solid var(--ln);border-radius:var(--r)}.pn h2,.pn h3{margin:0 0 12px}.pn p{margin:10px 0}
.lk{background:none;border:0;color:var(--ac);cursor:pointer;font:inherit}
.gl{columns:3 240px;gap:16px}.gl img{width:100%;margin-bottom:16px;border-radius:14px;cursor:zoom-in;transition:transform .4s}.gl img:hover{transform:scale(1.03)}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:99}#lb.on{display:grid}#lb img{max-width:92vw;max-height:90vh;border-radius:12px}
iframe{width:100%;height:100%;min-height:320px;border:0;border-radius:var(--r)}
footer{text-align:center;color:var(--mut);padding:30px;border-top:1px solid var(--ln)}
@media(max-width:800px){.hero{grid-template-columns:1fr;min-height:auto}nav{flex-wrap:wrap}.links{order:3;flex-basis:100%}main{padding-top:130px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.rv{opacity:1}}
</style></head><body>
<nav><a class="logo" href="#/home">Hindnet</a>
<div class="links"><a href="#/home">Hindnet Prime</a><a href="#/laptops">Elite Laptops</a><a href="#/accessories">Gear Studio</a><a href="#/travel">Travel Lounge</a><a href="#/gallery">Showcase</a><a href="#/connect">Connect</a></div>
<button class="ib" onclick="tg()" aria-label="Theme">◐</button><a class="ib" href="#/preferences">Preferences</a><a class="btn p sm" id="mb" href="#/member">Member Access</a></nav>
<main id="app"></main><footer>© Hindnet. Laptops, accessories aur travel.</footer><div id="lb" onclick="this.classList.remove('on')"><img alt=""></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,getDocs,addDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// ====== APNI DETAILS YAHAN DAALEIN ======
const FB={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"};
const CFG={wa:"919999999999",phone:"+91 99999 99999",mail:"hello@hindnet.in",addr:"Hindnet, Shop address yahan likhein",brands:["Dell","HP","Lenovo","Asus","Apple","Acer","MSI"]};
// ========================================
const fb=initializeApp(FB),auth=getAuth(fb),db=getFirestore(fb),$=s=>document.querySelector(s);
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S={},U=null,R=0,TY="Train";try{S=JSON.parse(localStorage.hn||"{}")}catch{}
const keep=()=>{try{localStorage.hn=JSON.stringify(S)}catch{}};
const theme=()=>{const t=S.t||"dark";document.documentElement.dataset.theme=t=="auto"?(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark"):t;document.body.classList.toggle("noanim",S.a===0)};
const list=async c=>{try{return(await getDocs(query(collection(db,c),orderBy("at","desc")))).docs.map(d=>({id:d.id,...d.data()}))}catch(_){return[]}};
const card=x=>`<div class="card rv tilt"><img loading="lazy" src="${e(x.img)}" alt="${e(x.name)}"><div class="b"><small>${e(x.brand)}</small><h3>${e(x.name)}</h3><p class="m">${e(x.specs)}</p><div class="row"><b>₹${Number(x.price)?Number(x.price).toLocaleString("en-IN"):e(x.price)}</b><a class="btn p sm" target="_blank" rel="noopener" href="https://wa.me/${CFG.wa}?text=${encodeURIComponent("Hindnet: "+x.name+" ke baare me jaankari chahiye")}">Enquire</a></div></div></div>`;
const LP=(t,s,c)=>async()=>{const L=await list(c);return`<h1 class="ph">${t}</h1><p class="lead">${s}</p><input class="sr" placeholder="Search karein" oninput="flt(this.value)" aria-label="Search"><div class="g">${L.map(card).join("")||'<p class="m">Abhi koi item nahi hai. Admin panel se add karein.</p>'}</div>`};
const P={
home:async()=>{const L=(await list("laptops")).slice(0,3);return`<div class="hero"><div><h1>Premium laptops, accessories aur tickets. Ek hi jagah.</h1><p class="lead">Hindnet par aapko chuni hui laptops, kaam ke accessories aur train ya flight ki booking milti hai, seedhi aur bharosemand.</p><a class="btn p" href="#/laptops">Laptops dekhein</a> <a class="btn" href="#/travel">Ticket book karein</a></div><div class="lap"><div class="scr"><s></s><s></s><s></s><s></s></div><div class="bs"></div></div></div>
<div class="mq"><span>${CFG.brands.concat(CFG.brands).concat(CFG.brands).concat(CFG.brands).map(b=>`<i>${b}</i>`).join("")}</span></div>
<div class="stats rv"><div><b class="cnt" data-n="500">0</b><b>+</b><p>Khush customers</p></div><div><b class="cnt" data-n="120">0</b><b>+</b><p>Laptop models</p></div><div><b class="cnt" data-n="1000">0</b><b>+</b><p>Tickets book hue</p></div></div>
<h2>Naye aur khaas laptops</h2><div class="g">${L.map(card).join("")||'<p class="m">Laptops jald yahan dikhengi.</p>'}</div>
<h2>Hindnet par aur kya milta hai</h2><div class="g"><a class="card rv b tilt" href="#/accessories" style="text-decoration:none;color:inherit"><h3>Gear Studio</h3><p class="m">Mouse, keyboard, bag, charger aur bahut kuch.</p></a><a class="card rv b tilt" href="#/travel" style="text-decoration:none;color:inherit"><h3>Travel Lounge</h3><p class="m">Train aur flight ticket ki request bhejein.</p></a><a class="card rv b tilt" href="#/gallery" style="text-decoration:none;color:inherit"><h3>Showcase</h3><p class="m">Hamari dukaan aur products ki photos.</p></a></div>`},
laptops:LP("Elite Laptops","Har budget ke liye chuni hui, jaanchi hui laptops.","laptops"),
accessories:LP("Gear Studio","Aapki laptop ke liye zaroori accessories.","accessories"),
travel:async()=>`<h1 class="ph">Travel Lounge</h1><p class="lead">Train ya flight ki details bhejein. Hum ticket confirm karke aapko contact karenge. Request bhejne ke liye login zaroori hai.</p><div class="pn"><p><button class="btn p sm" id="tt" type="button" onclick="tab('Train')">Train</button> <button class="btn sm" id="tf" type="button" onclick="tab('Flight')">Flight</button></p><form onsubmit="bk(event)"><input name="from" placeholder="Kahan se" required><input name="to" placeholder="Kahan tak" required><input name="date" type="date" required><input name="pax" type="number" min="1" value="1" aria-label="Yatri"><button class="btn p" style="width:100%">Request bhejein</button></form><p class="m" id="er"></p></div>`,
gallery:async()=>{const L=await list("gallery");return`<h1 class="ph">Showcase</h1><p class="lead">Hamari dukaan aur products ki jhalak.</p><div class="gl">${L.map(x=>`<img class="rv" loading="lazy" src="${e(x.img)}" alt="${e(x.caption)}" onclick="lb(this.src)">`).join("")||'<p class="m">Photos jald aa rahi hain.</p>'}</div>`},
connect:async()=>`<h1 class="ph">Connect</h1><p class="lead">Kuch poochna hai? Seedha baat karein.</p><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card b"><h3>${e(CFG.phone)}</h3><p class="m">${e(CFG.mail)}</p><p>${e(CFG.addr)}</p><p><a class="btn p sm" target="_blank" rel="noopener" href="https://wa.me/${CFG.wa}">WhatsApp par baat karein</a></p></div><iframe loading="lazy" title="Map" src="https://maps.google.com/maps?q=${encodeURIComponent(CFG.addr)}&output=embed"></iframe></div>`,
preferences:async()=>`<h1 class="ph">Preferences</h1><div class="pn"><h3>Theme</h3><p>${["dark","light","auto"].map(t=>`<button class="btn sm ${(S.t||"dark")==t?"p":""}" onclick="set('t','${t}')">${{dark:"Dark",light:"Light",auto:"Auto"}[t]}</button>`).join(" ")}</p><h3>Animations</h3><p><button class="btn sm" onclick="set('a',${S.a===0?1:0})">${S.a===0?"Off hain. On karein":"On hain. Off karein"}</button></p></div>`,
member:async()=>U?`<div class="pn"><h2>Namaste, ${e(U.displayName||"member")}</h2><p class="m">${e(U.email)}</p><button class="btn" onclick="out()">Logout</button></div>`:`<div class="pn"><h2 id="mt">Member Access</h2><form onsubmit="au(event)"><input id="nm" name="n" placeholder="Aapka naam" style="display:none"><input name="e" type="email" placeholder="Email" required><input name="p" type="password" placeholder="Password (kam se kam 6)" minlength="6" required><button class="btn p" id="sb" style="width:100%">Login karein</button></form><p class="m" id="er"></p><p><button class="lk" type="button" onclick="sw()">Naya account banayein</button></p></div>`};
const io=new IntersectionObserver(es=>es.forEach(x=>{if(!x.isIntersecting)return;const t=x.target;t.classList.add("in");io.unobserve(t);t.querySelectorAll(".cnt").forEach(c=>{let n=0,m=+c.dataset.n;const id=setInterval(()=>{n=Math.min(m,n+Math.ceil(m/40));c.textContent=n;if(n>=m)clearInterval(id)},30)})}),{threshold:.12});
async function render(){const k=location.hash.slice(2)||"home",t=++R,h=await(P[k]||P.home)();if(t!=R)return;const A=$("#app");A.innerHTML=h;A.style.animation="none";A.offsetHeight;A.style.animation="";scrollTo(0,0);document.querySelectorAll(".rv,.stats").forEach(x=>io.observe(x));document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("on",a.hash=="#/"+k))}
Object.assign(window,{
flt:v=>document.querySelectorAll(".g .card").forEach(c=>c.style.display=c.textContent.toLowerCase().includes(v.toLowerCase())?"":"none"),
set:(k,v)=>{S[k]=v;keep();theme();render()},tg:()=>{S.t=document.documentElement.dataset.theme=="dark"?"light":"dark";keep();theme();if(location.hash=="#/preferences")render()},
lb:s=>{$("#lb img").src=s;$("#lb").classList.add("on")},out:()=>signOut(auth),
tab:t=>{TY=t;$("#tt").classList.toggle("p",t=="Train");$("#tf").classList.toggle("p",t=="Flight")},
bk:async ev=>{ev.preventDefault();if(!U){location.hash="#/member";return}const f=ev.target.elements;try{await addDoc(collection(db,"bookings"),{type:TY,from:f.from.value,to:f.to.value,date:f.date.value,pax:+f.pax.value,email:U.email,at:Date.now()});$("#er").textContent="Request mil gayi. Hum jald contact karenge.";ev.target.reset()}catch(x){$("#er").textContent="Request nahi gayi. Dobara koshish karein."}},
sw:()=>{const r=$("#nm").style.display=="none";$("#nm").style.display=r?"":"none";$("#sb").textContent=r?"Account banayein":"Login karein"},
au:async ev=>{ev.preventDefault();const f=ev.target.elements,reg=$("#nm").style.display!="none";try{if(reg){const c=await createUserWithEmailAndPassword(auth,f.e.value,f.p.value);await updateProfile(c.user,{displayName:f.n.value})}else await signInWithEmailAndPassword(auth,f.e.value,f.p.value);location.hash="#/home"}catch(x){$("#er").textContent="Email ya password galat hai, ya account pehle se maujood hai."}}});
document.addEventListener("mousemove",ev=>{const c=ev.target.closest?.(".tilt");if(!c||S.a===0)return;const r=c.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;c.style.transform=`perspective(800px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-4px)`});
document.addEventListener("mouseout",ev=>{const c=ev.target.closest?.(".tilt");if(c&&!c.contains(ev.relatedTarget))c.style.transform=""});
addEventListener("hashchange",render);theme();
onAuthStateChanged(auth,u=>{U=u;$("#mb").textContent=u?(u.displayName||"Account").split(" ")[0]:"Member Access";render()});
</script></body></html>
